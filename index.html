<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบเรียกคิวผู้ป่วย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap">
<style>
:root{--blue:#0a4f8f;--teal:#0b8aa0;--ink:#0f2a43;--muted:#5d7189;--line:#d6e2ee;--bg:#eaf2f8;--green:#12a150;--pink:#e8508f;--red:#d93025}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;cursor:default}
body.idle{cursor:none}
.screen{height:100vh;height:100dvh;display:grid;grid-template-rows:14vh 1fr 7vh;padding-top:env(safe-area-inset-top,0px)}

/* หัวจอ */
header{display:flex;align-items:center;justify-content:space-between;padding:0 3vw;color:#fff;background:linear-gradient(90deg,var(--blue),var(--teal))}
.brand{display:flex;align-items:center;gap:1.6vw}
.logo{width:10.5vh;height:10.5vh;border-radius:50%;background:#fff;flex:none;overflow:hidden;box-shadow:0 .3vh 1vh rgba(0,0,0,.25)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.hname{font-size:min(4.6vh,3.2vw);font-weight:800;line-height:1.1}
.hsub{font-size:min(2.8vh,2vw);opacity:.92;font-weight:600}
.clock{text-align:right}
.time{font-size:min(6.5vh,4.6vw);font-weight:800;line-height:1}
.date{font-size:min(2.6vh,1.9vw);opacity:.92}

/* เนื้อหา */
main{display:grid;grid-template-columns:1.7fr 1fr;gap:2vw;padding:2.2vh 2vw}
.panel{background:#fff;border-radius:2vh;box-shadow:0 .6vh 2vh rgba(10,79,143,.12);overflow:hidden;display:flex;flex-direction:column}
.ptitle{padding:1.6vh 2vw;font-size:min(4vh,2.8vw);font-weight:700;color:#fff;text-align:center}
.now .ptitle{background:var(--pink)}
.done .ptitle{background:var(--red)}
.nowbody{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column}
#now{font-size:min(30vw,46vh);font-weight:800;color:var(--blue);line-height:1;letter-spacing:.02em}
.hint{font-size:min(3.2vh,2.2vw);color:var(--muted);margin-top:1vh}
.list{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:6.4vh;align-content:start;padding:1.4vh 1.4vw;gap:1vh 1vw}
.item{display:flex;align-items:center;justify-content:center;background:#fdeceb;border:.3vh solid #f3c4c0;border-radius:1.4vh;font-size:min(4.8vh,3.2vw);font-weight:800;color:#a1261b;min-height:0}
.empty{grid-column:1/-1;margin-top:4vh;text-align:center;color:var(--muted);font-size:min(3.4vh,2.4vw)}

/* เมื่อเรียกคิวใหม่ */
.flash{animation:flash 1s ease-in-out 5}
@keyframes flash{0%,100%{background:#fff}50%{background:#fde1ee}}

/* ท้ายจอ */
footer{display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:var(--blue);color:#fff;font-size:min(3vh,2.1vw)}
.dot{display:inline-block;width:1.6vh;height:1.6vh;border-radius:50%;background:#5be28d;margin-right:.8vw}
.dot.off{background:#ff6b5e}

@media (max-width:800px){
  html,body{overflow:auto}
  .screen{height:auto;min-height:100dvh;grid-template-rows:auto auto auto}
  header{padding:12px 16px}
  main{grid-template-columns:1fr;padding:12px}
  .list{grid-auto-rows:64px;gap:8px}
  #now{font-size:34vw}
  footer{padding:10px 16px;gap:8px;flex-wrap:wrap}
}
</style>
</head>

    <div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
  </header>

  <main>
    <section class="panel now" id="nowPanel">
      <div class="ptitle">บัตรคิวสีชมพูหมายเลข</div>
      <div class="nowbody"><div id="now">-</div><div class="hint">กรุณาเข้าห้องตรวจเมื่อถึงหมายเลขของท่าน</div></div>
    </section>
    <section class="panel done">
      <div class="ptitle" id="missTitle">เรียกไม่พบ</div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <footer>
    <span id="notice"></span>
    <span><span class="dot" id="dot"></span><span id="stat">กำลังเชื่อมต่อ</span></span>
  </footer>
</div>

<script>
// ===== ตั้งค่า =====
// ค่าเริ่มต้น (ใช้เมื่อลิงก์ไม่ได้ระบุ ?id=...)
var DEFAULT_SHEET_ID = "1rq0DEgJN7-uimll1ZCRdhIkMWS6UXjXJ6d02dW8Lgr0";
var DEFAULT_TAB = "Sheet1";               // แท็บของชีตแสดงผล: A=queue, B=status, C2=คิวปัจจุบัน (ตั้งใหม่เมื่อมีชีตแสดงผลจริง)
// เปลี่ยนชีตได้โดยไม่ต้องแก้โค้ด: ต่อท้ายลิงก์ด้วย ?id=<ID หรือลิงก์ชีตทั้งก้อน>&tab=<ชื่อแท็บ>
var P = new URLSearchParams(location.search);
function sheetId(v){ var m = /\/d\/([\w-]+)/.exec(v || ""); return m ? m[1] : (v || "").trim(); }
var SHEET_ID = sheetId(P.get("id")) || DEFAULT_SHEET_ID;
var TAB = P.get("tab") || DEFAULT_TAB;
var HOSPITAL_NAME = "ศูนย์การแพทย์กาญจนาภิเษก";   // ชื่อ รพ. ที่แสดงบนหัวจอ
var DEPARTMENT = "แผนกเวชศาสตร์ครอบครัว";    // ชื่อแผนก/จุดบริการ
var NOTICE = " ";
var POLL_MS = 3000;                       // รีเฟรชทุก 3 วินาที
var MISSED_SHOWN = 16;                    // จำนวนคิว "เรียกไม่พบ" สูงสุดที่แสดง (2 คอลัมน์ x 8 แถว)
var S_MISSED = "เรียกไม่พบ";             // สถานะที่จะแสดงในช่องด้านขวา
// ====================

var $ = function(id){ return document.getElementById(id); };
var rows = [], current = "", ok = false, lastNow = null, cbN = 0;

$("hname").textContent = HOSPITAL_NAME;
$("hsub").textContent = DEPARTMENT;
$("notice").textContent = NOTICE;

// โหลดผ่านแท็ก <script> เพื่อเลี่ยงปัญหา CORS (ใช้ได้ทั้งเปิดจากไฟล์ในเครื่องและจากเว็บ)
function load(){
  return new Promise(function(resolve, reject){
    var cb = "gv_" + (++cbN) + "_" + Date.now(), sc = document.createElement("script");
    var t = setTimeout(function(){ cleanup(); reject(new Error("timeout")); }, 8000);
    function cleanup(){ clearTimeout(t); delete window[cb]; if (sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb] = function(r){
      cleanup();
      if (!r || r.status !== "ok" || !r.table){ reject(new Error("bad response")); return; }
      var cur = "";
      rows = r.table.rows.map(function(row){
        var c = row.c || [];
        var v = function(i){ return c[i] && c[i].v != null ? String(c[i].v).trim() : ""; };
        if (!cur && v(2) && v(2).toLowerCase() !== "current") cur = v(2);   // คิวปัจจุบันอยู่คอลัมน์ C
        return {q: v(0), s: v(1)};
      }).filter(function(x){ return x.q && x.q.toLowerCase() !== "queue"; });
      current = cur;
      ok = true; resolve();
    };
    sc.onerror = function(){ cleanup(); reject(new Error("load error")); };
    sc.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?sheet=" + encodeURIComponent(TAB) + "&headers=1&tqx=responseHandler:" + cb;
    document.head.appendChild(sc);
  }).catch(function(e){ ok = false; console.error(e); });
}

function render(){
  var now = current || "-";
  $("now").textContent = now;
  if (lastNow !== null && lastNow !== now){
    var p = $("nowPanel"); p.classList.remove("flash"); void p.offsetWidth; p.classList.add("flash");
  }
  lastNow = now;

  // แสดงเฉพาะคิวที่สถานะเป็น "เรียกไม่พบ" (เรียงตามลำดับในชีต)
  var missed = rows.filter(function(r){ return r.s === S_MISSED; });
  var html = missed.slice(0, MISSED_SHOWN).map(function(r){ return '<div class="item">' + r.q + "</div>"; }).join("");
  $("missTitle").textContent = missed.length > MISSED_SHOWN ? "เรียกไม่พบ (และอีก " + (missed.length - MISSED_SHOWN) + " คิว)" : "เรียกไม่พบ";
  $("list").innerHTML = html || '<div class="empty">ไม่มีคิวที่เรียกไม่พบ</div>';

  $("dot").classList.toggle("off", !ok);
  $("stat").textContent = ok ? "เชื่อมต่อแล้ว" : "ขาดการเชื่อมต่อ กำลังลองใหม่";
}

function clock(){
  var d = new Date();
  $("time").textContent = d.toLocaleTimeString("th-TH", {hour: "2-digit", minute: "2-digit"}) + " น.";
  $("date").textContent = d.toLocaleDateString("th-TH", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
}
clock(); setInterval(clock, 1000);

function tick(){ load().then(render); }
tick(); setInterval(tick, POLL_MS);

// ดับเบิลคลิกหรือกด F = เต็มจอ / ซ่อนเมาส์เมื่อไม่ได้ขยับ
function fs(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
}
document.addEventListener("dblclick", fs);
document.addEventListener("keydown", function(e){ if (e.key === "f" || e.key === "F") fs(); });
var idleT;
function wake(){ document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(function(){ document.body.classList.add("idle"); }, 3000); }
document.addEventListener("mousemove", wake); wake();
</script>
